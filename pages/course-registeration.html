<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>انتخاب واحد دانشجو</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/student.css">
</head>

<body>

    <div data-include="../partials/header.html"></div>
    <div id="sidebar-container" data-include=""></div>

    <main class="main">
        <h2>دروس ارائه شده نیمسال</h2>

        <div id="search-section">
            <input type="text" id="course-search" placeholder="جستجو (بر اساس کد درس یا نام استاد)...">
        </div>

        <div id="course-list-container" class="card">
            <table class="course-table">
                <thead>
                    <tr>
                        <th>درس</th>
                        <th>استاد</th>
                        <th>شماره گروه</th>
                        <th>ظرفیت</th>
                        <th>زمان‌بندی</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="sections-table-body">
                </tbody>
            </table>
            <p id="no-results" style="display: none; text-align: center; color: gray; margin-top: 15px;">
                موردی یافت نشد.
            </p>
        </div>

        <h2 style="margin-top: 30px;">دروس اخذ شده</h2>
        <div id="enrolled-list-container" class="card">
            <table class="course-table">
                <thead>
                    <tr>
                        <th>درس</th>
                        <th>استاد</th>
                        <th>شماره گروه</th>
                        <th>نیمسال</th>
                        <th>زمان‌بندی</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="enrolled-table-body">
                </tbody>
            </table>
            <p id="no-enrolled" style="display: none; text-align: center; color: gray; margin-top: 15px;">
                هنوز درسی اخذ نکرده‌اید.
            </p>
        </div>
    </main>

    <div data-include="../partials/footer.html"></div>

    <script src="../js/layout.js"></script>
    <script src="../js/course-registeration.js"></script>
</body>

</html>
