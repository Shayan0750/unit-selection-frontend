<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>انتخاب واحد دانشجو</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/student.css">
</head>

<body>

    <div data-include="../partials/header.html"></div>
    <div id="sidebar-container" data-include=""></div>

    <main class="main">
        <h2>دروس ارائه شده (ترم جاری)</h2>

        <div class="search-box-container" style="margin-bottom: 15px;">
            <input type="text" id="course-search" class="form-control"
                placeholder="جستجو (نام درس، کد یا نام استاد)...">
        </div>

        <div class="card">
            <table class="course-table">
                <thead>
                    <tr>
                        <th>مشخصات درس</th>
                        <th>استاد</th>
                        <th>ظرفیت</th>
                        <th>زمان‌بندی کلاس</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="sections-table-body">
                </tbody>
            </table>
            <p id="no-results" class="text-center text-muted" style="display: none; padding: 20px;">
                موردی یافت نشد یا لیست بارگذاری نشده است.
            </p>
        </div>

        <h2 style="margin-top: 40px; border-top: 2px dashed #eee; padding-top: 20px;">
            برنامه هفتگی شما (دروس اخذ شده)
        </h2>
        <div class="card" style="border-right: 4px solid #4caf50;">
            <table class="course-table">
                <thead>
                    <tr>
                        <th>مشخصات درس</th>
                        <th>استاد</th>
                        <th>واحد</th>
                        <th>گروه</th>
                        <th>زمان‌بندی</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="enrolled-table-body">
                </tbody>
            </table>
            <p id="no-enrolled" class="text-center text-muted" style="display: none; padding: 20px;">
                هنوز درسی اخذ نکرده‌اید.
            </p>
        </div>
    </main>

    <div data-include="../partials/footer.html"></div>

    <script src="../js/layout.js"></script>
    <script src="../js/course-registeration.js"></script>
</body>

</html>
