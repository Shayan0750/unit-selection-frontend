<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>دروس ارائه شده</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/student.css">
</head>

<body>

    <div data-include="../partials/header.html"></div>
    <div id="sidebar-container" data-include="../partials/sidebar.html"></div>

    <main class="main">
        <h2>دروس ارائه شده</h2>

        <!-- فیلد انتخاب نیمسال شیک -->
        <div id="term-select-container" style="margin-bottom: 20px;">
            <label for="termSelect" style="margin-right: 10px; font-weight: bold;">انتخاب نیمسال:</label>
            <select id="termSelect" class="form-control" style="max-width: 250px; display: inline-block;"></select>
        </div>

        <!-- فیلد جستجو -->
        <div id="search-section" style="margin-bottom: 15px;">
            <input type="text" id="course-search" placeholder="جستجو (کد درس یا نام استاد)..."
                   class="form-control" style="max-width: 400px; display: inline-block;">
        </div>

        <!-- جدول سکشن‌ها -->
        <div id="course-list-container" class="card">
            <table class="course-table">
                <thead>
                    <tr>
                        <th>کد درس</th>
                        <th>نام درس</th>
                        <th>شماره گروه</th>
                        <th>نام استاد</th>
                        <th>ظرفیت</th>
                        <th>زمان‌بندی (روز / ساعت / کلاس)</th>
                    </tr>
                </thead>
                <tbody id="sections-table-body"></tbody>
            </table>
            <p id="no-results" style="display: none; text-align: center; color: gray; margin-top: 15px;">
                برای این نیمسال درسی ارائه نشده است.
            </p>
        </div>
    </main>

    <div data-include="../partials/footer.html"></div>

    <script src="../js/layout.js"></script>
    <script src="../js/offered-sections.js"></script>
</body>

</html>
